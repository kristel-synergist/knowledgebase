<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts Direct Knowledge Desk</title><style>body{margin:0;background:#f5f3ee;color:#18362b;font:16px Arial,sans-serif}main{max-width:860px;margin:auto;padding:56px 20px}h1{font-family:Georgia,serif;font-size:42px;margin:0 0 8px}.sub{color:#53665d;margin:0 0 28px}.search{display:flex;gap:8px}.search input,textarea,input{width:100%;box-sizing:border-box;border:1px solid #b9c5bd;border-radius:8px;padding:13px;font:inherit}button{border:0;background:#173d2f;color:white;padding:13px 18px;border-radius:8px;font-weight:bold;cursor:pointer}.card{background:#fff;border:1px solid #dbe2dc;border-radius:12px;padding:20px;margin-top:16px}.tag{display:inline-block;background:#e6eee8;padding:4px 8px;border-radius:12px;margin:3px;font-size:13px}.hidden{display:none}textarea{min-height:150px;margin:8px 0}#status{color:#5a685f}</style></head><body><main><h1>Accounts Direct Knowledge Desk</h1><p class="sub">Plain-English operational guidance for teams and clients.</p><div class="search"><input id="q" placeholder="Ask a question, for example: VAT filing before trading"><button onclick="search()">Search</button></div><p id="status"></p><section id="results"></section><section id="admin" class="card hidden"><h2>Learning Desk</h2><p>Paste a rough note. It will be drafted and can then be published immediately.</p><input id="secret" type="password" placeholder="Admin secret"><textarea id="note" placeholder="Paste the note here"></textarea><button onclick="draft()">Create draft</button><div id="draft"></div></section></main><script>const $=id=>document.getElementById(id);let article=null;async function search(){let q=$('q').value.trim();if(!q)return;$('status').textContent='Searching...';let r=await fetch('/api/kb?action=search&q='+encodeURIComponent(q));let d=await r.json();$('status').textContent=d.length?d.length+' result(s) found.':'No result found yet.';$('results').innerHTML=d.map(x=>'<article class="card"><h2>'+x.title+'</h2><p>'+x.summary+'</p><p>'+x.content.replace(/
/g,'<br>')+'</p><div>'+(x.tags||[]).map(t=>'<span class="tag">'+t+'</span>').join('')+'</div></article>').join('')}async function draft(){let r=await fetch('/api/kb',{method:'POST',headers:{'content-type':'application/json','x-admin-secret':$('secret').value},body:JSON.stringify({action:'draft',text:$('note').value})});let d=await r.json();if(!r.ok){$('draft').textContent=d.error||'Unable to create draft.';return}article=d;$('draft').innerHTML='<h3>'+d.title+'</h3><p>'+d.summary+'</p><p>'+d.content+'</p><button onclick="publishArticle()">Publish now</button>'}async function publishArticle(){let r=await fetch('/api/kb',{method:'POST',headers:{'content-type':'application/json','x-admin-secret':$('secret').value},body:JSON.stringify({action:'publish',article})});let d=await r.json();$('draft').textContent=r.ok?'Published. It is now live in search.':(d.error||'Publishing failed.')}if(location.search.includes('admin=1'))$('admin').classList.remove('hidden');$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()})</script></body></html>
