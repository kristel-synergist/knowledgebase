<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts Direct Knowledge Desk</title><style>body{margin:0;background:#f5f3ee;color:#18362b;font:16px Arial,sans-serif}main{max-width:860px;margin:auto;padding:56px 20px}h1{font-family:Georgia,serif;font-size:42px;margin:0 0 8px}.sub{color:#53665d;margin:0 0 28px}.search{display:flex;gap:8px}.search input,textarea,input{width:100%;box-sizing:border-box;border:1px solid #b9c5bd;border-radius:8px;padding:13px;font:inherit}button{border:0;background:#173d2f;color:white;padding:13px 18px;border-radius:8px;font-weight:bold;cursor:pointer}.card{background:#fff;border:1px solid #dbe2dc;border-radius:12px;padding:20px;margin-top:16px}.tag{display:inline-block;background:#e6eee8;padding:4px 8px;border-radius:12px;margin:3px;font-size:13px}.hidden{display:none}textarea{min-height:150px;margin:8px 0}</style></head><body><main><h1>Accounts Direct Knowledge Desk</h1><p class="sub">Plain-English operational guidance for teams and clients.</p><div class="search"><input id="q" placeholder="Ask a question, for example: VAT filing before trading"><button onclick="searchKB()">Search</button></div><p id="status"></p><section id="results"></section><section id="admin" class="card hidden"><h2>Learning Desk</h2><p>Paste a rough note. It will be drafted and can then be published immediately.</p><input id="secret" type="password" placeholder="Admin secret"><textarea id="note" placeholder="Paste the note here"></textarea><button onclick="draftKB()">Create draft</button><div id="draft"></div></section></main><script>const el=id=>document.getElementById(id);let currentArticle=null;window.searchKB=async()=>{const query=el("q").value.trim();if(!query)return;el("status").textContent="Searching...";const response=await fetch("/api/kb?action=search&q="+encodeURIComponent(query));const data=await response.json();el("status").textContent=data.length?data.length+" result(s) found.":"No result found yet.";el("results").innerHTML=data.map(item=>"<article class=card><h2>"+item.title+"</h2><p>"+item.summary+"</p><p>"+item.content.split("\n").join("<br>")+"</p><div>"+(item.tags||[]).map(tag=>"<span class=tag>"+tag+"</span>").join("")+"</div></article>").join("")};window.draftKB=async()=>{const response=await fetch("/api/kb",{method:"POST",headers:{"content-type":"application/json","x-admin-secret":el("secret").value},body:JSON.stringify({action:"draft",text:el("note").value})});const data=await response.json();if(!response.ok){el("draft").textContent=data.error||"Unable to create draft.";return}currentArticle=data;el("draft").innerHTML="<h3>"+data.title+"</h3><p>"+data.summary+"</p><p>"+data.content+"</p><button onclick=publishKB()>Publish now</button>"};window.publishKB=async()=>{const response=await fetch("/api/kb",{method:"POST",headers:{"content-type":"application/json","x-admin-secret":el("secret").value},body:JSON.stringify({action:"publish",article:currentArticle})});const data=await response.json();el("draft").textContent=response.ok?"Published. It is now live in search.":(data.error||"Publishing failed.")};if(location.search.includes("admin=1"))el("admin").classList.remove("hidden");el("q").addEventListener("keydown",event=>{if(event.key==="Enter")searchKB()});</script></body></html>
