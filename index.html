<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accounts Direct Knowledge Desk</title><style>body{margin:0;background:#f5f3ee;color:#18362b;font:16px Arial,sans-serif}main{max-width:860px;margin:auto;padding:56px 20px}h1{font-family:Georgia,serif;font-size:42px;margin:0 0 8px}.sub,.help{color:#53665d;line-height:1.5}.sub{margin:0 0 28px}.search,.actions{display:flex;gap:8px}.search input,textarea,input{width:100%;box-sizing:border-box;border:1px solid #b9c5bd;border-radius:8px;padding:13px;font:inherit}button{border:0;background:#173d2f;color:white;padding:13px 18px;border-radius:8px;font-weight:bold;cursor:pointer}.secondary{background:#fff;color:#173d2f;border:1px solid #b9c5bd}.card{background:#fff;border:1px solid #dbe2dc;border-radius:12px;padding:20px;margin-top:16px}.tag{display:inline-block;background:#e6eee8;padding:4px 8px;border-radius:12px;margin:3px;font-size:13px}.hidden{display:none}textarea{min-height:240px;margin:8px 0}.field{display:block;margin-top:13px;font-weight:700}.field input,.field textarea{margin-top:6px;font-weight:400}</style></head><body><main><h1>Accounts Direct Knowledge Desk</h1><p class="sub">Plain-English operational guidance for teams and clients.</p><div class="search"><input id="q" placeholder="Ask a question, for example: VAT filing before trading"><button onclick="searchKB()">Search</button></div><p id="status"></p><section id="results"></section><section id="admin" class="card hidden"><h2>Learning Desk</h2><p class="help">Create a clean article using the fields below. Titles, tags, paragraphs and numbered steps are preserved when published.</p><input id="secret" type="password" placeholder="Admin secret"><label class="field">Title<input id="title" placeholder="Clear article title"></label><label class="field">Summary<input id="summary" placeholder="One-sentence practical summary"></label><label class="field">Tags<input id="tags" placeholder="For example: bank feed, Xero, FYI, XPM"></label><label class="field">Article body<textarea id="body" placeholder="Paste the full article here. Line breaks will remain readable."></textarea></label><div class="actions"><button class="secondary" onclick="clearArticle()">Clear</button><button onclick="draftKB()">Preview article</button></div><div id="draft"></div></section></main><script>const el=id=>document.getElementById(id);let currentArticle=null;const safe=s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");const card=a=>"<article class=card><h2>"+safe(a.title)+"</h2><p>"+safe(a.summary)+"</p><p>"+safe(a.content).replace(/\n/g,"<br>")+"</p><div>"+(a.tags||[]).map(t=>"<span class=tag>"+safe(t)+"</span>").join("")+"</div></article>";window.searchKB=async()=>{const q=el("q").value.trim();if(!q)return;el("status").textContent="Searching...";const r=await fetch("/api/kb?action=search&q="+encodeURIComponent(q)),data=await r.json();el("status").textContent=data.length?data.length+" result(s) found.":"No result found yet.";el("results").innerHTML=data.map(card).join("")};window.draftKB=()=>{const title=el("title").value.trim(),summary=el("summary").value.trim(),content=el("body").value.trim(),tags=el("tags").value.split(",").map(t=>t.trim()).filter(Boolean);if(!title||!summary||!content){el("draft").innerHTML="<p class=help>Please complete the title, summary and article body.</p>";return}currentArticle={title,summary,content,tags,source_text:content,status:"published"};el("draft").innerHTML="<h3>Preview</h3>"+card(currentArticle)+"<button onclick=publishKB()>Publish now</button>"};window.clearArticle=()=>{["title","summary","tags","body"].forEach(id=>el(id).value="");currentArticle=null;el("draft").innerHTML=""};window.publishKB=async()=>{if(!currentArticle)return;const r=await fetch("/api/kb",{method:"POST",headers:{"content-type":"application/json","x-admin-secret":el("secret").value},body:JSON.stringify({action:"publish",article:currentArticle})}),data=await r.json();el("draft").innerHTML=r.ok?"<p>Published. It is now live in search.</p>":"<p class=help>"+safe(data.error||"Publishing failed.")+"</p>"};if(location.search.includes("admin=1"))el("admin").classList.remove("hidden");el("q").addEventListener("keydown",e=>{if(e.key==="Enter")searchKB()});</script></body></html>
